name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  dotnet:
    name: .NET build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore API tests
        run: dotnet restore tests/api-dotnet/EnterpriseDocumentAssistant.Api.Tests.csproj

      - name: Run API tests with coverage
        run: >-
          dotnet test tests/api-dotnet/EnterpriseDocumentAssistant.Api.Tests.csproj
          --configuration Release
          --no-restore
          --collect:"XPlat Code Coverage"
          --results-directory tests/api-dotnet/TestResults

      - name: Enforce .NET coverage floors
        run: >-
          python3 scripts/check_coverage.py
          "tests/api-dotnet/TestResults/**/coverage.cobertura.xml"
          --minimum-line-rate 0.60
          --minimum-branch-rate 0.50

      - name: Upload .NET coverage
        uses: actions/upload-artifact@v7
        with:
          name: dotnet-coverage
          path: tests/api-dotnet/TestResults/**/coverage.cobertura.xml
          if-no-files-found: error
          retention-days: 7

  python:
    name: Python lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: src/ai-service-python/requirements-dev.txt

      - name: Install Python dependencies
        run: python -m pip install --requirement src/ai-service-python/requirements-dev.txt

      - name: Lint Python code
        run: ruff check src/ai-service-python/app tests/ai-service-python scripts/check_coverage.py scripts/create_dev_token.py scripts/demo_flow.py

      - name: Check Python formatting
        run: ruff format --check src/ai-service-python/app tests/ai-service-python scripts/check_coverage.py scripts/create_dev_token.py scripts/demo_flow.py

      - name: Run Python tests
        env:
          PYTHONPATH: src/ai-service-python
        run: pytest tests/ai-service-python

  containers:
    name: Compose build and health checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Docker Compose configuration
        run: docker compose config

      - name: Build Docker Compose stack
        run: docker compose build

      - name: Start Docker Compose stack
        run: docker compose up --detach

      - name: Wait for service health endpoints
        shell: bash
        run: |
          set -euo pipefail

          wait_for_url() {
            local name="$1"
            local url="$2"

            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error "$url" > /dev/null; then
                echo "$name is ready"
                return 0
              fi

              echo "Waiting for $name ($attempt/30)"
              sleep 2
            done

            echo "$name did not become ready"
            return 1
          }

          wait_for_url "ASP.NET Core API" "http://localhost:5000/health"
          wait_for_url "FastAPI service" "http://localhost:8000/health"

      - name: Verify pgvector database schema
        shell: bash
        run: |
          set -euo pipefail

          query_database() {
            docker compose exec -T postgres psql \
              --username "${POSTGRES_USER:-documents}" \
              --dbname "${POSTGRES_DB:-documents}" \
              --no-psqlrc \
              --tuples-only \
              --no-align \
              --set ON_ERROR_STOP=1 \
              --command "$1"
          }

          test "$(query_database "SELECT count(*) FROM pg_extension WHERE extname = 'vector';")" = "1"
          test "$(query_database "SELECT count(*) FROM pg_attribute a JOIN pg_class c ON c.oid = a.attrelid JOIN pg_namespace n ON n.oid = c.relnamespace WHERE n.nspname = 'public' AND c.relname = 'document_chunks' AND a.attname = 'embedding' AND format_type(a.atttypid, a.atttypmod) = 'vector(8)';")" = "1"
          test "$(query_database "SELECT count(*) FROM pg_indexes WHERE schemaname = 'public' AND tablename = 'document_chunks' AND indexname = 'ix_document_chunks_embedding_cosine';")" = "1"

      - name: Verify ingestion and ownership schema
        shell: bash
        run: |
          set -euo pipefail

          query_database() {
            docker compose exec -T postgres psql \
              --username "${POSTGRES_USER:-documents}" \
              --dbname "${POSTGRES_DB:-documents}" \
              --no-psqlrc \
              --tuples-only \
              --no-align \
              --set ON_ERROR_STOP=1 \
              --command "$1"
          }

          test "$(query_database "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public' AND table_name = 'document_ingestion_jobs';")" = "1"
          test "$(query_database "SELECT column_default FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'document_ingestion_jobs' AND column_name = 'status';")" = "'Pending'::text"
          test "$(query_database "SELECT column_default FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'document_ingestion_jobs' AND column_name = 'max_attempts';")" = "3"
          test "$(query_database "SELECT count(*) FROM pg_constraint WHERE conname = 'ck_document_ingestion_jobs_status';")" = "1"
          test "$(query_database "SELECT count(*) FROM pg_indexes WHERE schemaname = 'public' AND tablename = 'document_ingestion_jobs' AND indexname = 'ux_document_ingestion_jobs_active_document';")" = "1"
          test "$(query_database "SELECT count(*) FROM pg_indexes WHERE schemaname = 'public' AND tablename = 'document_ingestion_jobs' AND indexname = 'ix_document_ingestion_jobs_claim';")" = "1"
          test "$(query_database "SELECT count(*) FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'documents' AND column_name = 'owner_id' AND is_nullable = 'NO';")" = "1"
          test "$(query_database "SELECT count(*) FROM pg_constraint WHERE conname = 'ck_documents_owner_id_not_blank';")" = "1"
          test "$(query_database "SELECT count(*) FROM pg_indexes WHERE schemaname = 'public' AND tablename = 'documents' AND indexname = 'ix_documents_owner_created_at';")" = "1"

      - name: Verify authenticated ingestion and owner-isolated retrieval across restart
        shell: bash
        run: |
          set -euo pipefail

          token=$(python3 scripts/create_dev_token.py --user ci-user --role User)
          other_token=$(python3 scripts/create_dev_token.py --user other-user --role User)
          admin_token=$(python3 scripts/create_dev_token.py --user ci-admin --role Admin)
          export token

          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:5000/api/documents)" = "401"

          curl --fail --silent --show-error \
            --header "Authorization: Bearer $token" \
            http://localhost:5000/api/auth/me > /tmp/principal.json

          curl --fail --silent --show-error \
            --header "Authorization: Bearer $token" \
            --form "file=@samples/contract-policy.txt;type=text/plain" \
            http://localhost:5000/api/documents/upload > /tmp/upload-response.json

          python3 - <<'PY'
          import json
          import os
          import time
          from urllib import request

          with open('/tmp/upload-response.json', encoding='utf-8') as response_file:
              upload = json.load(response_file)

          assert upload['indexingStatus'] == 'queued_for_background_processing', upload
          assert upload['ingestionJobId'] > 0, upload
          status_url = f"http://localhost:5000{upload['processingStatusUrl']}"
          deadline = time.monotonic() + 60
          headers = {'Authorization': f"Bearer {os.environ['token']}"}

          while time.monotonic() < deadline:
              status_request = request.Request(status_url, headers=headers)
              with request.urlopen(status_request, timeout=10) as response:
                  status = json.load(response)

              if status['status'] == 'Completed':
                  assert status['isTerminal'] is True, status
                  break
              if status['status'] == 'Failed':
                  raise AssertionError(status)

              time.sleep(1)
          else:
              raise AssertionError('Background ingestion did not complete within 60 seconds.')
          PY

          assert_search_result() {
            local bearer_token="$1"
            local expected_count="$2"

            curl --fail --silent --show-error \
              --header "Authorization: Bearer $bearer_token" \
              --header "Content-Type: application/json" \
              --data '{"query":"vendor contract approval process","topK":3}' \
              http://localhost:5000/api/documents/search > /tmp/search-response.json

            python3 - "$expected_count" <<'PY'
          import json
          import sys

          expected_count = int(sys.argv[1])
          with open('/tmp/search-response.json', encoding='utf-8') as response_file:
              response = json.load(response_file)

          if expected_count == 0:
              assert response['resultCount'] == 0, response
          else:
              assert response['resultCount'] > 0, response
              assert any(result['fileName'] == 'contract-policy.txt' for result in response['results']), response
          PY
          }

          assert_search_result "$token" 1
          assert_search_result "$other_token" 0
          assert_search_result "$admin_token" 1

          docker compose restart document-api

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://localhost:5000/health > /dev/null; then
              break
            fi

            if [ "$attempt" -eq 30 ]; then
              echo "ASP.NET Core API did not become ready after restart"
              exit 1
            fi

            sleep 2
          done

          assert_search_result "$token" 1
          assert_search_result "$other_token" 0
          assert_search_result "$admin_token" 1

          chunk_count=$(docker compose exec -T postgres psql \
            --username "${POSTGRES_USER:-documents}" \
            --dbname "${POSTGRES_DB:-documents}" \
            --no-psqlrc \
            --tuples-only \
            --no-align \
            --set ON_ERROR_STOP=1 \
            --command "SELECT count(*) FROM document_chunks;")

          owned_document_count=$(docker compose exec -T postgres psql \
            --username "${POSTGRES_USER:-documents}" \
            --dbname "${POSTGRES_DB:-documents}" \
            --no-psqlrc \
            --tuples-only \
            --no-align \
            --set ON_ERROR_STOP=1 \
            --command "SELECT count(*) FROM documents WHERE owner_id = 'ci-user';")

          completed_job_count=$(docker compose exec -T postgres psql \
            --username "${POSTGRES_USER:-documents}" \
            --dbname "${POSTGRES_DB:-documents}" \
            --no-psqlrc \
            --tuples-only \
            --no-align \
            --set ON_ERROR_STOP=1 \
            --command "SELECT count(*) FROM document_ingestion_jobs WHERE status = 'Completed';")

          test "$chunk_count" -gt 0
          test "$owned_document_count" -eq 1
          test "$completed_job_count" -gt 0

      - name: Show container status and logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color

      - name: Stop Docker Compose stack
        if: always()
        run: docker compose down --volumes --remove-orphans
