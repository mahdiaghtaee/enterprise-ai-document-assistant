name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  dotnet:
    name: .NET build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore API tests
        run: dotnet restore tests/api-dotnet/EnterpriseDocumentAssistant.Api.Tests.csproj

      - name: Run API tests with coverage
        run: >-
          dotnet test tests/api-dotnet/EnterpriseDocumentAssistant.Api.Tests.csproj
          --configuration Release
          --no-restore
          --collect:"XPlat Code Coverage"
          --results-directory tests/api-dotnet/TestResults

      - name: Enforce .NET coverage floors
        run: >-
          python3 scripts/check_coverage.py
          "tests/api-dotnet/TestResults/**/coverage.cobertura.xml"
          --minimum-line-rate 0.60
          --minimum-branch-rate 0.50

      - name: Upload .NET coverage
        uses: actions/upload-artifact@v7
        with:
          name: dotnet-coverage
          path: tests/api-dotnet/TestResults/**/coverage.cobertura.xml
          if-no-files-found: error
          retention-days: 7

  python:
    name: Python lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: src/ai-service-python/requirements-dev.txt

      - name: Install Python dependencies
        run: python -m pip install --requirement src/ai-service-python/requirements-dev.txt

      - name: Lint Python code
        run: ruff check src/ai-service-python/app tests/ai-service-python scripts/check_coverage.py scripts/create_dev_token.py scripts/demo_flow.py

      - name: Check Python formatting
        run: ruff format --check src/ai-service-python/app tests/ai-service-python scripts/check_coverage.py scripts/create_dev_token.py scripts/demo_flow.py

      - name: Run Python tests
        env:
          PYTHONPATH: src/ai-service-python
        run: pytest tests/ai-service-python

  containers:
    name: Compose build and health checks
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Docker Compose configuration
        run: docker compose config

      - name: Build Docker Compose stack
        run: docker compose build

      - name: Start Docker Compose stack
        run: docker compose up --detach

      - name: Wait for service health endpoints
        shell: bash
        run: |
          set -euo pipefail

          wait_for_url() {
            local name="$1"
            local url="$2"

            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error "$url" > /dev/null; then
                echo "$name is ready"
                return 0
              fi

              echo "Waiting for $name ($attempt/30)"
              sleep 2
            done

            echo "$name did not become ready"
            return 1
          }

          wait_for_url "ASP.NET Core API" "http://localhost:5000/health"
          wait_for_url "FastAPI service" "http://localhost:8000/health"
          test "$(docker compose ps --status running --services | grep -c '^document-worker$')" = "1"

      - name: Verify pgvector database schema
        shell: bash
        run: |
          set -euo pipefail

          query_database() {
            docker compose exec -T postgres psql \
              --username "${POSTGRES_USER:-documents}" \
              --dbname "${POSTGRES_DB:-documents}" \
              --no-psqlrc \
              --tuples-only \
              --no-align \
              --set ON_ERROR_STOP=1 \
              --command "$1"
          }

          test "$(query_database "SELECT count(*) FROM pg_extension WHERE extname = 'vector';")" = "1"
          test "$(query_database "SELECT count(*) FROM pg_attribute a JOIN pg_class c ON c.oid = a.attrelid JOIN pg_namespace n ON n.oid = c.relnamespace WHERE n.nspname = 'public' AND c.relname = 'document_chunks' AND a.attname = 'embedding' AND format_type(a.atttypid, a.atttypmod) = 'vector(8)';")" = "1"
          test "$(query_database "SELECT count(*) FROM pg_indexes WHERE schemaname = 'public' AND tablename = 'document_chunks' AND indexname = 'ix_document_chunks_embedding_cosine';")" = "1"

      - name: Verify ingestion, tenant lifecycle, and trust-boundary schema
        shell: bash
        run: |
          set -euo pipefail

          query_database() {
            docker compose exec -T postgres psql \
              --username "${POSTGRES_USER:-documents}" \
              --dbname "${POSTGRES_DB:-documents}" \
              --no-psqlrc \
              --tuples-only \
              --no-align \
              --set ON_ERROR_STOP=1 \
              --command "$1"
          }

          test "$(query_database "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public' AND table_name = 'document_ingestion_jobs';")" = "1"
          test "$(query_database "SELECT column_default FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'document_ingestion_jobs' AND column_name = 'status';")" = "'Pending'::text"
          test "$(query_database "SELECT column_default FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'document_ingestion_jobs' AND column_name = 'max_attempts';")" = "3"
          test "$(query_database "SELECT count(*) FROM pg_constraint WHERE conname = 'ck_document_ingestion_jobs_status';")" = "1"
          test "$(query_database "SELECT count(*) FROM pg_indexes WHERE schemaname = 'public' AND tablename = 'document_ingestion_jobs' AND indexname = 'ux_document_ingestion_jobs_active_document';")" = "1"
          test "$(query_database "SELECT count(*) FROM pg_indexes WHERE schemaname = 'public' AND tablename = 'document_ingestion_jobs' AND indexname = 'ix_document_ingestion_jobs_claim';")" = "1"
          test "$(query_database "SELECT count(*) FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'documents' AND column_name IN ('tenant_id', 'owner_id') AND is_nullable = 'NO';")" = "2"
          test "$(query_database "SELECT count(*) FROM information_schema.columns WHERE table_schema = 'public' AND table_name IN ('document_chunks', 'document_ingestion_jobs') AND column_name = 'tenant_id' AND is_nullable = 'NO';")" = "2"
          test "$(query_database "SELECT count(*) FROM pg_constraint WHERE conname IN ('ck_documents_tenant_id_not_blank', 'ck_document_chunks_tenant_id_not_blank', 'ck_document_ingestion_jobs_tenant_id_not_blank');")" = "3"
          test "$(query_database "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public' AND table_name IN ('tenants', 'tenant_memberships', 'tenant_invitations');")" = "3"
          test "$(query_database "SELECT count(*) FROM pg_class WHERE relname IN ('documents', 'document_chunks', 'document_ingestion_jobs', 'tenants', 'tenant_memberships', 'tenant_invitations') AND relrowsecurity AND relforcerowsecurity;")" = "6"
          test "$(query_database "SELECT count(*) FROM pg_roles WHERE rolname IN ('document_app', 'document_platform', 'document_privileged') AND NOT rolsuper AND NOT rolbypassrls;")" = "3"
          test "$(query_database "SELECT count(*) FROM pg_constraint WHERE conname IN ('ck_tenants_status', 'ck_tenant_memberships_role', 'ck_tenant_memberships_status', 'ck_tenant_invitations_token_hash', 'ck_tenant_invitations_status');")" = "5"
          test "$(query_database "SELECT count(*) FROM pg_indexes WHERE schemaname = 'public' AND tablename = 'tenant_invitations' AND indexname IN ('ux_tenant_invitations_token_hash', 'ux_tenant_invitations_pending_invitee');")" = "2"
          test "$(query_database "SELECT count(*) FROM pg_policies WHERE schemaname = 'public' AND tablename IN ('tenants', 'tenant_memberships', 'tenant_invitations') AND policyname IN ('tenant_tenants', 'privileged_tenants', 'platform_tenants', 'tenant_memberships_policy', 'privileged_memberships', 'platform_memberships', 'tenant_invitations_policy', 'privileged_invitations', 'platform_invitations');")" = "9"

          if docker compose exec -T document-api env | grep --quiet '^ConnectionStrings__PostgresPrivileged='; then
            echo "document-api unexpectedly received the privileged worker connection"
            exit 1
          fi
          docker compose exec -T document-api env | grep --quiet '^ConnectionStrings__PostgresPlatform='
          docker compose exec -T document-worker env | grep --quiet '^ConnectionStrings__PostgresPrivileged='

      - name: Verify managed lifecycle, tenant isolation, worker processing, and persistence
        shell: bash
        run: |
          set -euo pipefail

          tenant_a_user=$(python3 scripts/create_dev_token.py --user ci-user --tenant tenant-a --role User)
          tenant_a_other=$(python3 scripts/create_dev_token.py --user other-user --tenant tenant-a --role User)
          stale_admin=$(python3 scripts/create_dev_token.py --user stale-admin --tenant tenant-a --role Admin)
          tenant_a_admin=$(python3 scripts/create_dev_token.py --user tenant-a-admin --tenant tenant-a --role Admin)
          tenant_b_admin=$(python3 scripts/create_dev_token.py --user tenant-b-admin --tenant tenant-b --role Admin)
          platform_admin=$(python3 scripts/create_dev_token.py --user platform-admin --tenant platform --role PlatformAdmin)
          export tenant_a_user

          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:5000/api/documents)" = "401"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --header "Authorization: Bearer $tenant_a_user" http://localhost:5000/api/documents)" = "403"

          provision_tenant() {
            local tenant_id="$1"
            local display_name="$2"
            local admin_user_id="$3"

            curl --fail --silent --show-error \
              --header "Authorization: Bearer $platform_admin" \
              --header "Content-Type: application/json" \
              --data "{\"tenantId\":\"$tenant_id\",\"displayName\":\"$display_name\",\"initialAdminUserId\":\"$admin_user_id\"}" \
              http://localhost:5000/api/platform/tenants > "/tmp/provision-$tenant_id.json"
          }

          invite_and_accept() {
            local admin_token="$1"
            local member_token="$2"
            local user_id="$3"
            local role="$4"
            local output_name="$5"

            curl --fail --silent --show-error \
              --header "Authorization: Bearer $admin_token" \
              --header "Content-Type: application/json" \
              --data "{\"inviteeUserId\":\"$user_id\",\"role\":\"$role\",\"lifetimeHours\":24}" \
              http://localhost:5000/api/tenant/invitations > "/tmp/invite-$output_name.json"

            python3 - "/tmp/invite-$output_name.json" > "/tmp/token-$output_name.txt" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding='utf-8') as response_file:
              invitation = json.load(response_file)
          assert invitation['status'] == 'Pending', invitation
          assert invitation['token'], invitation
          print(invitation['token'])
          PY

            local invitation_token
            invitation_token=$(cat "/tmp/token-$output_name.txt")
            curl --fail --silent --show-error \
              --header "Authorization: Bearer $member_token" \
              --header "Content-Type: application/json" \
              --data "{\"token\":\"$invitation_token\"}" \
              http://localhost:5000/api/tenant/invitations/accept > "/tmp/accept-$output_name.json"
          }

          provision_tenant "tenant-a" "Tenant A" "tenant-a-admin"
          provision_tenant "tenant-b" "Tenant B" "tenant-b-admin"
          invite_and_accept "$tenant_a_admin" "$tenant_a_user" "ci-user" "User" "ci-user"
          invite_and_accept "$tenant_a_admin" "$tenant_a_other" "other-user" "User" "other-user"
          invite_and_accept "$tenant_a_admin" "$stale_admin" "stale-admin" "User" "stale-admin"

          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --header "Authorization: Bearer $stale_admin" http://localhost:5000/api/tenant/members)" = "403"

          curl --fail --silent --show-error \
            --header "Authorization: Bearer $tenant_a_user" \
            http://localhost:5000/api/auth/me > /tmp/principal.json

          python3 - <<'PY'
          import json

          with open('/tmp/principal.json', encoding='utf-8') as response_file:
              principal = json.load(response_file)

          assert principal['userId'] == 'ci-user', principal
          assert principal['tenantId'] == 'tenant-a', principal
          assert principal['tenantManaged'] is True, principal
          assert principal['tenantActive'] is True, principal
          assert principal['membershipActive'] is True, principal
          assert principal['membershipRole'] == 'User', principal
          PY

          curl --fail --silent --show-error \
            --header "Authorization: Bearer $tenant_a_user" \
            --form "file=@samples/contract-policy.txt;type=text/plain" \
            http://localhost:5000/api/documents/upload > /tmp/upload-response.json

          python3 - <<'PY'
          import json
          import os
          import time
          from urllib import request

          with open('/tmp/upload-response.json', encoding='utf-8') as response_file:
              upload = json.load(response_file)

          assert upload['indexingStatus'] == 'queued_for_background_processing', upload
          assert upload['ingestionJobId'] > 0, upload
          status_url = f"http://localhost:5000{upload['processingStatusUrl']}"
          deadline = time.monotonic() + 60
          headers = {'Authorization': f"Bearer {os.environ['tenant_a_user']}"}

          while time.monotonic() < deadline:
              status_request = request.Request(status_url, headers=headers)
              with request.urlopen(status_request, timeout=10) as response:
                  status = json.load(response)

              if status['status'] == 'Completed':
                  assert status['isTerminal'] is True, status
                  break
              if status['status'] == 'Failed':
                  raise AssertionError(status)

              time.sleep(1)
          else:
              raise AssertionError('Independent background ingestion did not complete within 60 seconds.')
          PY

          assert_search_result() {
            local bearer_token="$1"
            local expected_count="$2"

            curl --fail --silent --show-error \
              --header "Authorization: Bearer $bearer_token" \
              --header "Content-Type: application/json" \
              --data '{"query":"vendor contract approval process","topK":3}' \
              http://localhost:5000/api/documents/search > /tmp/search-response.json

            python3 - "$expected_count" <<'PY'
          import json
          import sys

          expected_count = int(sys.argv[1])
          with open('/tmp/search-response.json', encoding='utf-8') as response_file:
              response = json.load(response_file)

          if expected_count == 0:
              assert response['resultCount'] == 0, response
          else:
              assert response['resultCount'] > 0, response
              assert any(result['fileName'] == 'contract-policy.txt' for result in response['results']), response
          PY
          }

          assert_search_result "$tenant_a_user" 1
          assert_search_result "$tenant_a_other" 0
          assert_search_result "$tenant_a_admin" 1
          assert_search_result "$tenant_b_admin" 0
          assert_search_result "$platform_admin" 1

          curl --fail --silent --show-error \
            --request DELETE \
            --header "Authorization: Bearer $tenant_a_admin" \
            http://localhost:5000/api/tenant/members/other-user > /tmp/removed-member.json
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --header "Authorization: Bearer $tenant_a_other" http://localhost:5000/api/documents)" = "403"

          curl --fail --silent --show-error \
            --header "Authorization: Bearer $platform_admin" \
            --header "Content-Type: application/json" \
            --data '{"status":"Disabled"}' \
            http://localhost:5000/api/platform/tenants/tenant-b/status > /tmp/disabled-tenant.json
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --header "Authorization: Bearer $tenant_b_admin" http://localhost:5000/api/documents)" = "403"

          invitation_token=$(cat /tmp/token-ci-user.txt)
          plaintext_token_count=$(docker compose exec -T postgres psql \
            --username "${POSTGRES_USER:-documents}" \
            --dbname "${POSTGRES_DB:-documents}" \
            --no-psqlrc \
            --tuples-only \
            --no-align \
            --set ON_ERROR_STOP=1 \
            --command "SELECT count(*) FROM tenant_invitations WHERE token_hash = '$invitation_token';")
          test "$plaintext_token_count" = "0"

          docker compose restart document-api document-worker

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://localhost:5000/health > /dev/null; then
              break
            fi

            if [ "$attempt" -eq 30 ]; then
              echo "ASP.NET Core API did not become ready after restart"
              exit 1
            fi

            sleep 2
          done

          assert_search_result "$tenant_a_user" 1
          assert_search_result "$tenant_a_admin" 1
          assert_search_result "$platform_admin" 1
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --header "Authorization: Bearer $tenant_a_other" http://localhost:5000/api/documents)" = "403"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --header "Authorization: Bearer $tenant_b_admin" http://localhost:5000/api/documents)" = "403"

          chunk_count=$(docker compose exec -T postgres psql \
            --username "${POSTGRES_USER:-documents}" \
            --dbname "${POSTGRES_DB:-documents}" \
            --no-psqlrc \
            --tuples-only \
            --no-align \
            --set ON_ERROR_STOP=1 \
            --command "SELECT count(*) FROM document_chunks WHERE tenant_id = 'tenant-a';")
          owned_document_count=$(docker compose exec -T postgres psql \
            --username "${POSTGRES_USER:-documents}" \
            --dbname "${POSTGRES_DB:-documents}" \
            --no-psqlrc \
            --tuples-only \
            --no-align \
            --set ON_ERROR_STOP=1 \
            --command "SELECT count(*) FROM documents WHERE tenant_id = 'tenant-a' AND owner_id = 'ci-user';")
          completed_job_count=$(docker compose exec -T postgres psql \
            --username "${POSTGRES_USER:-documents}" \
            --dbname "${POSTGRES_DB:-documents}" \
            --no-psqlrc \
            --tuples-only \
            --no-align \
            --set ON_ERROR_STOP=1 \
            --command "SELECT count(*) FROM document_ingestion_jobs WHERE tenant_id = 'tenant-a' AND status = 'Completed';")
          active_membership_count=$(docker compose exec -T postgres psql \
            --username "${POSTGRES_USER:-documents}" \
            --dbname "${POSTGRES_DB:-documents}" \
            --no-psqlrc \
            --tuples-only \
            --no-align \
            --set ON_ERROR_STOP=1 \
            --command "SELECT count(*) FROM tenant_memberships WHERE tenant_id = 'tenant-a' AND user_id = 'ci-user' AND status = 'Active';")

          test "$chunk_count" -gt 0
          test "$owned_document_count" -eq 1
          test "$completed_job_count" -gt 0
          test "$active_membership_count" -eq 1

      - name: Show container status and logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color

      - name: Stop Docker Compose stack
        if: always()
        run: docker compose down --volumes --remove-orphans
