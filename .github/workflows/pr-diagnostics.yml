name: PR Diagnostics

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnostics:
    name: Capture build diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python validation tools
        run: python -m pip install --requirement src/ai-service-python/requirements-dev.txt

      - name: Capture .NET test and coverage output
        shell: bash
        run: |
          set +e
          dotnet test tests/api-dotnet/EnterpriseDocumentAssistant.Api.Tests.csproj \
            --configuration Release \
            --collect:"XPlat Code Coverage" \
            --results-directory diagnostics/TestResults \
            > dotnet-full.log 2>&1
          status=$?
          tail -n 400 dotnet-full.log > dotnet-diagnostics.log
          echo "$status" > dotnet-exit-code.txt
          exit 0

      - name: Capture coverage floor output
        shell: bash
        run: |
          set +e
          python3 scripts/check_coverage.py \
            "diagnostics/TestResults/**/coverage.cobertura.xml" \
            --minimum-line-rate 0.60 \
            --minimum-branch-rate 0.50 \
            > coverage-diagnostics.log 2>&1
          status=$?
          echo "$status" > coverage-exit-code.txt
          exit 0

      - name: Capture Python formatting output
        shell: bash
        run: |
          set +e
          ruff format --check --diff scripts/demo_flow.py > python-format-diagnostics.log 2>&1
          status=$?
          echo "$status" > python-format-exit-code.txt
          exit 0

      - name: Upload diagnostics
        uses: actions/upload-artifact@v7
        with:
          name: pr-diagnostics
          path: |
            dotnet-diagnostics.log
            dotnet-exit-code.txt
            coverage-diagnostics.log
            coverage-exit-code.txt
            diagnostics/TestResults/**/coverage.cobertura.xml
            python-format-diagnostics.log
            python-format-exit-code.txt
          if-no-files-found: error
          retention-days: 1
