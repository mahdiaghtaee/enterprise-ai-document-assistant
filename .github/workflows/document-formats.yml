name: Safe document format integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  document-formats:
    name: PDF DOCX signatures and worker processing
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate smoke script syntax
        run: python3 -m py_compile scripts/document_format_smoke.py

      - name: Validate Docker Compose configuration
        run: docker compose config

      - name: Build and start stack
        run: docker compose up --detach --build

      - name: Wait for API and dependencies
        shell: bash
        run: |
          set -euo pipefail

          wait_for_url() {
            local name="$1"
            local url="$2"

            for attempt in $(seq 1 40); do
              if curl --fail --silent --show-error "$url" > /dev/null; then
                echo "$name is ready"
                return 0
              fi

              echo "Waiting for $name ($attempt/40)"
              sleep 2
            done

            echo "$name did not become ready"
            return 1
          }

          wait_for_url "document API" "http://localhost:5000/health/ready"
          wait_for_url "AI service" "http://localhost:8000/health"
          test "$(docker compose ps --status running --services | grep -c '^document-worker$')" = "1"

      - name: Verify safe PDF and DOCX ingestion
        run: python3 scripts/document_format_smoke.py

      - name: Show service logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose down --volumes --remove-orphans
