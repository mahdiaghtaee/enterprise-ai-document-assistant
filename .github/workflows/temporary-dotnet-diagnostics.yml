name: Temporary .NET diagnostics

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  dotnet-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Run tests and retain TRX
        shell: bash
        run: |
          set +e
          dotnet test tests/api-dotnet/EnterpriseDocumentAssistant.Api.Tests.csproj \
            --configuration Release \
            --logger "trx;LogFileName=api-tests.trx" \
            --results-directory tests/api-dotnet/TestResults
          status=$?
          echo "$status" > tests/api-dotnet/TestResults/exit-code.txt
          exit 0
      - name: Upload diagnostics
        uses: actions/upload-artifact@v7
        with:
          name: temporary-dotnet-diagnostics
          path: tests/api-dotnet/TestResults
          if-no-files-found: error
          retention-days: 1
