version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: nuget
    directory: /src/api-dotnet
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      api-nuget-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: nuget
    directory: /tests/api-dotnet
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    allow:
      - dependency-name: "Microsoft.AspNetCore.Mvc.Testing"
      - dependency-name: "Microsoft.NET.Test.Sdk"
      - dependency-name: "coverlet.collector"
      - dependency-name: "System.Text.Json"
      - dependency-name: "xunit"
      - dependency-name: "xunit.runner.visualstudio"
    groups:
      test-nuget-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: pip
    directory: /src/ai-service-python
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      python-opentelemetry:
        patterns:
          - "opentelemetry-*"
        update-types:
          - minor
          - patch
      python-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "opentelemetry-*"
        update-types:
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: docker
    directory: /src/api-dotnet
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "dotnet/sdk"
        versions:
          - "9.x"
      - dependency-name: "dotnet/aspnet"
        versions:
          - "9.x"

  - package-ecosystem: docker
    directory: /src/ai-service-python
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
