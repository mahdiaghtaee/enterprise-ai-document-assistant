services:
  document-api:
    build:
      context: .
      dockerfile: src/api-dotnet/Dockerfile
    ports:
      - "${API_HOST_PORT:-5000}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ApplicationMode: Api
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-documents};Username=document_app;Password=${APP_DB_PASSWORD:-document-app-local}
      ConnectionStrings__PostgresPlatform: Host=postgres;Port=5432;Database=${POSTGRES_DB:-documents};Username=document_platform;Password=${PLATFORM_DB_PASSWORD:-document-platform-local}
      TenantLifecycle__AllowUnmanagedClaimsFallback: "false"
      SemanticIndex__Provider: Postgres
      Redis__ConnectionString: redis:6379
      AiService__BaseUrl: http://ai-service:8000
      DocumentProcessing__MaxPdfPages: ${DOCUMENT_MAX_PDF_PAGES:-200}
      DocumentProcessing__MaxDocxArchiveEntries: ${DOCUMENT_MAX_DOCX_ARCHIVE_ENTRIES:-2048}
      DocumentProcessing__MaxDocxExpandedBytes: ${DOCUMENT_MAX_DOCX_EXPANDED_BYTES:-52428800}
      DocumentProcessing__MaxExtractedCharacters: ${DOCUMENT_MAX_EXTRACTED_CHARACTERS:-1000000}
      DocumentProcessing__MaxDocxXmlCharacters: ${DOCUMENT_MAX_DOCX_XML_CHARACTERS:-5000000}
      FileThreatScanning__Provider: ${FILE_THREAT_SCANNING_PROVIDER:-Disabled}
      FileThreatScanning__Host: ${CLAMAV_HOST:-clamav}
      FileThreatScanning__Port: ${CLAMAV_PORT:-3310}
      FileThreatScanning__Timeout: ${CLAMAV_TIMEOUT:-00:00:10}
      FileThreatScanning__ChunkSizeBytes: ${CLAMAV_CHUNK_SIZE_BYTES:-65536}
      OpenTelemetry__ServiceName: enterprise-document-assistant-api
      OpenTelemetry__ServiceVersion: ${SERVICE_VERSION:-dev}
      OpenTelemetry__OtlpEndpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      AnswerGeneration__Provider: ${ANSWER_GENERATION_PROVIDER:-Deterministic}
      AnswerGeneration__MinimumSourceScore: ${ANSWER_MINIMUM_SOURCE_SCORE:-0.20}
      AnswerGeneration__MaxSources: ${ANSWER_MAX_SOURCES:-5}
      AnswerGeneration__MaxContextCharacters: ${ANSWER_MAX_CONTEXT_CHARACTERS:-12000}
      AnswerGeneration__RejectNearTieEvidence: ${ANSWER_REJECT_NEAR_TIE_EVIDENCE:-true}
      AnswerGeneration__ConflictScoreDelta: ${ANSWER_CONFLICT_SCORE_DELTA:-0.000001}
      AnswerGeneration__OpenAiCompatible__Endpoint: ${ANSWER_PROVIDER_ENDPOINT:-}
      AnswerGeneration__OpenAiCompatible__ApiKey: ${ANSWER_PROVIDER_API_KEY:-}
      AnswerGeneration__OpenAiCompatible__Model: ${ANSWER_PROVIDER_MODEL:-}
      AnswerGeneration__OpenAiCompatible__TimeoutSeconds: ${ANSWER_PROVIDER_TIMEOUT_SECONDS:-20}
      AnswerGeneration__OpenAiCompatible__MaxOutputTokens: ${ANSWER_PROVIDER_MAX_OUTPUT_TOKENS:-500}
    volumes:
      - document-storage:/app/storage/documents
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      ai-service:
        condition: service_started

  document-worker:
    build:
      context: .
      dockerfile: src/api-dotnet/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://127.0.0.1:8080
      ApplicationMode: Worker
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-documents};Username=document_privileged;Password=${PRIVILEGED_DB_PASSWORD:-document-privileged-local}
      ConnectionStrings__PostgresPrivileged: Host=postgres;Port=5432;Database=${POSTGRES_DB:-documents};Username=document_privileged;Password=${PRIVILEGED_DB_PASSWORD:-document-privileged-local}
      SemanticIndex__Provider: Postgres
      AiService__BaseUrl: http://ai-service:8000
      DocumentProcessing__MaxPdfPages: ${DOCUMENT_MAX_PDF_PAGES:-200}
      DocumentProcessing__MaxDocxArchiveEntries: ${DOCUMENT_MAX_DOCX_ARCHIVE_ENTRIES:-2048}
      DocumentProcessing__MaxDocxExpandedBytes: ${DOCUMENT_MAX_DOCX_EXPANDED_BYTES:-52428800}
      DocumentProcessing__MaxExtractedCharacters: ${DOCUMENT_MAX_EXTRACTED_CHARACTERS:-1000000}
      DocumentProcessing__MaxDocxXmlCharacters: ${DOCUMENT_MAX_DOCX_XML_CHARACTERS:-5000000}
      AuditRetention__Enabled: ${AUDIT_RETENTION_ENABLED:-false}
      AuditRetention__RetentionDays: ${AUDIT_RETENTION_DAYS:-90}
      AuditRetention__BatchSize: ${AUDIT_RETENTION_BATCH_SIZE:-1000}
      AuditRetention__MaxBatchesPerRun: ${AUDIT_RETENTION_MAX_BATCHES:-10}
      AuditRetention__Interval: ${AUDIT_RETENTION_INTERVAL:-1.00:00:00}
      AuditRetention__InitialDelay: ${AUDIT_RETENTION_INITIAL_DELAY:-00:01:00}
      OpenTelemetry__ServiceName: enterprise-document-assistant-worker
      OpenTelemetry__ServiceVersion: ${SERVICE_VERSION:-dev}
      OpenTelemetry__OtlpEndpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      AnswerGeneration__Provider: Deterministic
    volumes:
      - document-storage:/app/storage/documents
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started

  web-ui:
    build:
      context: .
      dockerfile: src/web-ui/Dockerfile
    ports:
      - "${WEB_UI_HOST_PORT:-3000}:80"
    depends_on:
      - document-api

  ai-service:
    build:
      context: .
      dockerfile: src/ai-service-python/Dockerfile
    ports:
      - "${AI_SERVICE_HOST_PORT:-8000}:8000"
    environment:
      APP_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      OTEL_SERVICE_NAME: enterprise-document-assistant-ai-service
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}

  postgres:
    image: pgvector/pgvector:0.8.5-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-documents}
      POSTGRES_USER: ${POSTGRES_USER:-documents}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-documents}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-document-app-local}
      PLATFORM_DB_PASSWORD: ${PLATFORM_DB_PASSWORD:-document-platform-local}
      PRIVILEGED_DB_PASSWORD: ${PRIVILEGED_DB_PASSWORD:-document-privileged-local}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"

volumes:
  postgres-data:
  document-storage:
